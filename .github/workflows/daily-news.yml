name: daily-news

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news and build issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_news.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data/issues.js)" ]; then
            git config user.name "factfolio-bot"
            git config user.email "factfolio-bot@users.noreply.github.com"
            git add data/issues.js
            git commit -m "chore: update daily issues"
            git push
          fi
